<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ note.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>{{ note.title }}</h1>
    <p class="text-muted">{{ note.created_at }}</p>
    <div class="card">
        <div class="card-body">
            <p>{{ note.text|linebreaks }}</p>
        </div>
    </div>
    <a href="{% url 'note_list' %}" class="btn btn-secondary mt-3">Назад</a>
    <a href="{% url 'note_update' note.pk %}" class="btn btn-warning mt-3">Редактировать</a>
    <a href="{% url 'note_delete' note.pk %}" class="btn btn-danger mt-3">Удалить</a>
</body>
</html>
